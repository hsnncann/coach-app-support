# Supabase Free plan projeleri 7 gün hareketsiz kalınca duraklatılıyor.
# İki günde bir tek bir okuma isteği projeyi uyanık tutuyor.
# Sırlar: SUPABASE_URL, SUPABASE_KEY (yayımlanabilir anahtar).
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
